<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Apartment Results</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div>
        <p class="eyebrow">MyHome &amp; SS.ge watcher</p>
        <h1>Live Apartment Results</h1>
        <p class="status">Auto-refreshes every 3 seconds</p>
      </div>
      <div class="header-meta">
        <div class="viewer" aria-label="Current account">
          <span>Logged in as</span>
          <strong id="logged-in-as">{{LOGGED_IN_AS}}</strong>
        </div>
        <div class="listing-count" aria-label="New listing count">
          <strong id="listing-count">{{LISTING_COUNT}}</strong>
          <span>apartments</span>
        </div>
      </div>
    </header>

    <section class="admin-controls" aria-labelledby="watcher-controls-title">
      <div class="control-heading">
        <div>
          <p class="eyebrow">Admin controls</p>
          <h2 id="watcher-controls-title">MyHome scraper</h2>
        </div>
        <button id="watcher-toggle" class="toggle-button" type="button">Loading…</button>
      </div>
      <form id="watcher-form">
        <label class="url-field">Filtered MyHome URL
          <input id="watcher-url" type="url" placeholder="https://www.myhome.ge/udzravi-qoneba/..." autocomplete="off">
        </label>
        <label>Pages
          <input id="watcher-pages" type="number" min="1" max="10" value="5" required>
        </label>
        <label>Every (seconds)
          <input id="watcher-interval" type="number" min="3" max="3600" value="3" required>
        </label>
        <button class="save-button" type="submit">Add search &amp; save</button>
      </form>
      <p id="watcher-message" class="control-message" aria-live="polite"></p>
      <div class="scraper-status" aria-live="polite">
        <span id="scraper-state" class="status-badge">Starting</span>
        <strong id="scraper-status-message">Connecting to scraper…</strong>
        <div class="status-stats">
          <span>Found <strong id="status-found">0</strong></span>
          <span>Imported <strong id="status-imported">0</strong>/<strong id="status-total">0</strong></span>
          <span>Last completed <strong id="status-completed">Never</strong></span>
        </div>
        <p id="status-error" class="status-error" hidden></p>
      </div>
      <div id="active-searches" class="active-searches"></div>
    </section>

    <nav class="district-filters" aria-label="Filter apartments by district">
      <button class="district-filter active" type="button" data-district="all">All</button>
      <button class="district-filter" type="button" data-district="Saburtalo">Saburtalo</button>
      <button class="district-filter" type="button" data-district="Vake">Vake</button>
      <button class="district-filter" type="button" data-district="Didi Dighomi">Didi Dighomi</button>
      <button class="district-filter" type="button" data-district="Digomi">Digomi</button>
    </nav>

    <section class="results" id="dashboard-content" aria-label="Apartment results">
      {{DASHBOARD_CONTENT}}
    </section>
  </main>
  <script>
    // Keep the editable template presentable when it is opened directly.
    // main.js replaces these markers with live data in live-results.html.
    const count = document.getElementById('listing-count');
    const viewer = document.getElementById('logged-in-as');
    const content = document.getElementById('dashboard-content');
    const toggle = document.getElementById('watcher-toggle');
    const form = document.getElementById('watcher-form');
    const message = document.getElementById('watcher-message');
    let watcherConfig = null;
    if (count.textContent.includes('{{LISTING_COUNT}}')) count.textContent = '0';
    if (viewer.textContent.includes('{{LOGGED_IN_AS}}')) viewer.textContent = 'Template preview';
    if (content.textContent.includes('{{DASHBOARD_CONTENT}}')) {
      content.innerHTML = '<div class="empty">Template preview — run the scraper to see live apartments.</div>';
    }
    const applyDistrict = district => {
      document.querySelectorAll('.district-filter').forEach(item => {
        item.classList.toggle('active', item.dataset.district === district);
      });
      document.querySelectorAll('tbody tr[data-district]').forEach(row => {
        row.hidden = district !== 'all' && row.dataset.district !== district;
      });
    };
    document.querySelectorAll('.district-filter').forEach(button => {
      button.addEventListener('click', () => {
        localStorage.setItem('apartment-district', button.dataset.district);
        applyDistrict(button.dataset.district);
      });
    });
    const savedDistrict = localStorage.getItem('apartment-district') || 'all';
    const knownDistrict = [...document.querySelectorAll('.district-filter')]
      .some(button => button.dataset.district === savedDistrict);
    applyDistrict(knownDistrict ? savedDistrict : 'all');

    const showWatcherConfig = config => {
      watcherConfig = config;
      toggle.textContent = config.enabled ? 'Stop scraper' : 'Start scraper';
      toggle.classList.toggle('running', config.enabled);
      document.getElementById('watcher-pages').value = config.pages;
      document.getElementById('watcher-interval').value = config.interval;
      const searchList = document.getElementById('active-searches');
      searchList.replaceChildren(...config.searches.map(search => {
        const badge = document.createElement('span');
        badge.textContent = search.district;
        return badge;
      }));
      showWatcherStatus(config.status);
    };
    const showWatcherStatus = status => {
      if (!status) return;
      const state = document.getElementById('scraper-state');
      state.textContent = status.state;
      state.className = `status-badge ${status.state}`;
      document.getElementById('scraper-status-message').textContent = status.message || '';
      document.getElementById('status-found').textContent = status.found || 0;
      document.getElementById('status-imported').textContent = status.imported || 0;
      document.getElementById('status-total').textContent = status.importTotal || 0;
      document.getElementById('status-completed').textContent = status.lastCompletedAt
        ? new Date(status.lastCompletedAt).toLocaleString() : 'Never';
      const error = document.getElementById('status-error');
      error.textContent = status.lastError || '';
      error.hidden = !status.lastError;
    };
    const saveWatcherConfig = async payload => {
      const response = await fetch('/api/watcher/config', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Could not update scraper');
      showWatcherConfig(result);
      message.textContent = 'Scraper settings saved.';
    };
    fetch('/api/watcher/config').then(response => response.json()).then(showWatcherConfig)
      .catch(error => { message.textContent = error.message; });
    setInterval(() => {
      fetch('/api/watcher/config').then(response => response.json())
        .then(config => showWatcherStatus(config.status)).catch(() => {});
    }, 1000);
    toggle.addEventListener('click', () => {
      if (!watcherConfig) return;
      saveWatcherConfig({ enabled: !watcherConfig.enabled }).catch(error => { message.textContent = error.message; });
    });
    form.addEventListener('submit', event => {
      event.preventDefault();
      saveWatcherConfig({
        url: document.getElementById('watcher-url').value.trim() || undefined,
        pages: Number(document.getElementById('watcher-pages').value),
        interval: Number(document.getElementById('watcher-interval').value),
        enabled: true
      }).then(() => { document.getElementById('watcher-url').value = ''; })
        .catch(error => { message.textContent = error.message; });
    });
    setInterval(() => {
      if (!document.activeElement.closest?.('.admin-controls')) location.reload();
    }, 3000);
  </script>
</body>
</html>
